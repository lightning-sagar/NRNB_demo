services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gem-mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
    networks:
      - gem-tools-net

networks:
  gem-tools-net:
    name: gem-tools-net
    driver: bridge
